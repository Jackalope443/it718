<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D&D 5e Character Logger</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 20px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select { width: 100%; padding: 8px; }
        button { padding: 10px 15px; background: #d92121; color: white; border: none; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #b01b1b; }
    </style>
</head>
<body>

    <h2>Log Character</h2>
    <form action="insert.php" method="POST">
        
        <div class="form-group">
            <label for="race">Race:</label>
            <select name="race_id" id="race" required>
                <option value="">--Select Race--</option>
                <option value="1">Dragonborn</option>
                <option value="2">Dwarf</option>
                <option value="3">Elf</option>
                <option value="4">Gnome</option>
                <option value="5">Half-Elf</option>
                <option value="6">Half-Orc</option>
                <option value="7">Halfling</option>
                <option value="8">Human</option>
                <option value="9">Tiefling</option>
            </select>
        </div>

        <div class="form-group">
            <label for="classSelect">Class:</label>
            <select name="class_id" id="classSelect" required>
                <option value="">--Select Class--</option>
                <option value="1">Barbarian</option>
                <option value="2">Bard</option>
                <option value="3">Cleric</option>
                <option value="4">Druid</option>
                <option value="5">Fighter</option>
                <option value="6">Monk</option>
                <option value="7">Paladin</option>
                <option value="8">Ranger</option>
                <option value="9">Rogue</option>
                <option value="10">Sorcerer</option>
                <option value="11">Warlock</option>
                <option value="12">Wizard</option>
                <option value="13">Artificer</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subclassSelect">Subclass:</label>
            <select name="subclass_id" id="subclassSelect" required disabled>
                <option value="">--Select a Class First--</option>
            </select>
        </div>

        <button type="submit">Save to Database</button>
    </form>

    <script>
        // Maps the Class ID to its respective Subclass IDs and Names
        const subclassData = {
            1: [{id: 1, name: 'Path of the Berserker'}, {id: 2, name: 'Path of the Totem Warrior'}],
            2: [{id: 3, name: 'College of Lore'}, {id: 4, name: 'College of Valor'}],
            3: [{id: 5, name: 'Knowledge Domain'}, {id: 6, name: 'Life Domain'}, {id: 7, name: 'Light Domain'}],
            4: [{id: 8, name: 'Circle of the Land'}, {id: 9, name: 'Circle of the Moon'}],
            5: [{id: 10, name: 'Champion'}, {id: 11, name: 'Battle Master'}, {id: 12, name: 'Eldritch Knight'}],
            6: [{id: 13, name: 'Way of the Open Hand'}, {id: 14, name: 'Way of Shadow'}],
            7: [{id: 15, name: 'Oath of Devotion'}, {id: 16, name: 'Oath of the Ancients'}],
            8: [{id: 17, name: 'Hunter'}, {id: 18, name: 'Beast Master'}],
            9: [{id: 19, name: 'Thief'}, {id: 20, name: 'Assassin'}, {id: 21, name: 'Arcane Trickster'}],
            10: [{id: 22, name: 'Draconic Bloodline'}, {id: 23, name: 'Wild Magic'}],
            11: [{id: 24, name: 'The Archfey'}, {id: 25, name: 'The Fiend'}, {id: 26, name: 'The Great Old One'}],
            12: [{id: 27, name: 'School of Abjuration'}, {id: 28, name: 'School of Evocation'}, {id: 29, name: 'School of Necromancy'}]
        };

        const classSelect = document.getElementById('classSelect');
        const subclassSelect = document.getElementById('subclassSelect');

        classSelect.addEventListener('change', function() {
            const classId = this.value;
            
            // Clear current options
            subclassSelect.innerHTML = '<option value="">--Select Subclass--</option>';
            
            if (classId && subclassData[classId]) {
                subclassSelect.disabled = false;
                
                // Populate new options based on the chosen class ID
                subclassData[classId].forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub.id; // This ensures the correct SQL ID is posted
                    option.textContent = sub.name;
                    subclassSelect.appendChild(option);
                });
            } else {
                subclassSelect.disabled = true;
                subclassSelect.innerHTML = '<option value="">--Select a Class First--</option>';
            }
        });
    </script>
</body>
</html>
